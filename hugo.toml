baseURL = 'https://ttvl.co/'
title = 'Toto Tvalavadze'

locale = "en-us"
DefaultContentLanguage = "en"

enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
canonifyURLs = false # breaks css since all links are no longer relative

disableKinds = ["taxonomy", "term"]

[params]
  author = "Toto Tvalavadze"
  github = "https://github.com/totocaster"
  facebook = "https://facebook.com/totocaster"
  description = "Public notebook and project archive. Analog photography, bookbinding, notebook systems, humane interfaces, and a monthly log."
  og_image = "/social/site.png" # last resort; head.html resolves generated cards from static/social/ first
  sitename = "Toto Tvalavadze"
  twitter = "@totocaster"
  instagram = "https://instagram.com/totocaster"
  membershipURL = "/membership"

[params.version]
  major = 7
  minor = 9
  update = 350

[params.subscription]
  monthly = "https://ttvl.memberful.com/checkout?plan=121779"
  yearly = "https://ttvl.memberful.com/checkout?plan=121780"

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1

[permalinks]
 log = "/log/:year/:month/"

[outputs]
  home = ["HTML", "RSS", "JSON", "social"]
  section = ["HTML"]
  page = ["HTML"]

[outputFormats]
  # Manifest for tools/social-cards.py; rendered by layouts/index.social.json.
  # Not an alternate of the home page, so no <link rel="alternate">.
  [outputFormats.social]
    mediaType = "application/json"
    baseName = "social"
    isPlainText = true
    notAlternative = true
  [outputFormats.email]
    mediaType = "text/html"
    baseName = "email"
    isHTML = true
    noUgly = true
    permalinkable = true
    rel = "alternate"

# `hugo --renderSegments social` renders only the social-card manifest, which
# is how tools/social-cards.py reads the site without a full build.
[segments]
  [segments.social]
    [[segments.social.includes]]
      kind = "home"
      output = "social"

# Declaring any mount replaces Hugo's defaults, so the standard directories
# are restated here. The extra static -> assets/static mount lets templates
# run the image pipeline over static files (newsletter contact-sheet thumbs).
# If archetypes/ or i18n/ are ever added, they need mounts here too.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static"
    target = "assets/static"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser.attribute]
      block = true # enables {.wide} on tables
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    style = "bw"
    noClasses = true
