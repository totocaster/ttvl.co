baseURL = 'https://ttvl.co/'
title = 'Toto Tvalavadze'

locale = "en-us"
DefaultContentLanguage = "en"

enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
canonifyURLs = false # breaks css since all links are no longer relative

disableKinds = ["taxonomy", "term"]

[params]
  author = "Toto Tvalavadze"
  github = "https://github.com/totocaster"
  facebook = "https://facebook.com/totocaster"
  og_image = "/ui/og.png" # TODO: replace with actual website image
  sitename = "Toto Tvalavadze"
  twitter = "@totocaster"
  instagram = "https://instagram.com/totocaster"
  membershipURL = "/membership"

[params.version]
  major = 7
  minor = 8
  update = 350

[params.subscription]
  monthly = "https://ttvl.memberful.com/checkout?plan=121779"
  yearly = "https://ttvl.memberful.com/checkout?plan=121780"

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1

[permalinks]
 log = "/log/:year/:month/"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]
  page = ["HTML"]

[outputFormats]
  [outputFormats.email]
    mediaType = "text/html"
    baseName = "email"
    isHTML = true
    noUgly = true
    permalinkable = true
    rel = "alternate"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser.attribute]
      block = true # enables {.wide} on tables
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    style = "bw"
    noClasses = true
