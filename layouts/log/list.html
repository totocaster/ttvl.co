{{ define "main" }}
<article class="log-content {{ with .Params.content_css }}{{ . }}{{ end }}">
  {{ if not .Params.hide_title }}
  <h1>{{ .Title }}</h1>
  {{ end }} {{ .Content }}
</article>

{{ range .Pages.ByDate.Reverse }}
<article class="log-list {{ with .Params.content_css }}{{ . }}{{ end }}">
  <h1 class="log">
    <a href="{{ .RelPermalink }}">{{ .Date.Format "2006.01" }}</a>
  </h1>
  {{ .Content }}
</article>
{{ end }} {{ partial "log-archive.html" (dict "page" .) }} {{ end }}
