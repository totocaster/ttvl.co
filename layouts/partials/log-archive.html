<section class="log-archive">
  {{ $logs := where .page.Site.RegularPages "Section" "log" }}
  {{ $years := $logs.GroupByDate "2006" }}
  {{ $title := .title | default "Archive" }}
  <h1>{{ $title }}</h1>
  <ul>
    {{ range $years }}
    <li>
      <b class="log-year">{{ .Key }}</b>: {{ range .Pages.ByDate.Reverse }}
      <a href="{{ .RelPermalink }}" class="log-month">{{ .Date.Format "1" }}</a>
      {{ end }}
    </li>
    {{ end }}
  </ul>
</section>
