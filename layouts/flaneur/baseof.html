<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Title tags -->
    <title itemprop="name">{{ with .Title }}{{ . }} — {{ end }}{{ .Site.Title }}</title>
    <!-- CSS and Styles -->
    {{ $style := resources.Get "scss/style.scss" | toCSS | minify }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" />
    <!-- Generator w/ version number. -->
    {{ hugo.Generator }}
  </head>
  <body>
    <div class="layout">
      <main>{{ block "main" . }}{{ end }}</main>
    </div>
  </body>
</html>
