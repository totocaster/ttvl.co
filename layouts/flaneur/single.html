{{ define "main" }}
<article class="flaneur">
  <section class="flaneur-header">
    <p><a href="/newsletter/">The Flâneur</a> &sdot; Dispatch {{ printf "%03d" .Params.issue }} &sdot; {{ .Params.date | time.Format "January 2, 2006" }}</p>
    <img class="flaneur-logo" src="/ui/flaneur-logo.png" alt="The Flâneur" />
  </section>
  <h1>{{ .Title }}</h1>
  <p class="subtitle">{{ .Params.description }}</p>

  {{ .Content }}
</article>
{{ partial "flaneur-subscribe.html" . }} {{ end }}
