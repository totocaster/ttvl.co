{{ define "main" }}
<h1>Index</h1>
<nav id="Index">
  <ul>
    {{ range where (where .Site.RegularPages "Kind" "page") "Section" "ne" "flaneur" }}
    <li>
      <a href="{{ .RelPermalink }}"> {{- if .Title -}} {{ .Title }} {{- else -}} {{ .File.Path }} {{- end -}} </a>
    </li>
    {{ end }}
  </ul>
</nav>
{{ end }}
