{{ define "main" }}
{{/*  <h1>{{ .Title }}</h1>  */}}
{{ .Content }}
<ul class="essays-list">
  {{ range .Pages.ByDate.Reverse }}
  <li>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01" }}</time>
    {{ with .Params.description }}
    <p>{{ . }}</p>
    {{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
