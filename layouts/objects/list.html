{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="objects-list">
  {{ range .Pages.ByDate.Reverse }} {{ $rating := .Params.rating }}
  <li{{ if .Draft }} class="draft"{{ end }}>
    <span class="rating"> {{- range seq 5 -}} {{- if le . $rating -}}★{{- else -}}☆{{- end -}} {{- end -}} </span>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
